<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Getting Your Location</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
      padding: 0 20px;
    }
    .status {
      font-size: 1.2rem;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🇬🇭 Welcome!</h1>
  <p class="status">Please wait while we get your location...turn on device location if still on this page</p>

  <script>
    const TALLY_URL = "https://tally.so/r/VL6NBE"; // Enter tally URL

    // ==========================================
    // GEOFENCE SETTINGS - UPDATE THESE VALUES
    // ==========================================
    const TARGET_LAT = 5.7133654;      // Latitude of the allowed location (e.g. office)
    const TARGET_LON = -0.0010199;     // Longitude of the allowed location
    const ALLOWED_RADIUS_METERS = 100; // How far from the target point is allowed (in meters)

    // Calculates the distance in meters between two GPS points using the Haversine formula
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Earth's radius in meters
      const toRad = (deg) => (deg * Math.PI) / 180;

      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    navigator.geolocation.getCurrentPosition(
      function (position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        const distance = getDistanceMeters(lat, lon, TARGET_LAT, TARGET_LON);

        if (distance <= ALLOWED_RADIUS_METERS) {
          // Within range — redirect to Tally form with lat/lon in query params
          const fullUrl = `${TALLY_URL}?latitude=${lat}&longitude=${lon}`;
          window.location.href = fullUrl;
        } else {
          // Outside the allowed radius — block access
          const distanceKm = (distance / 1000).toFixed(2);
          document.querySelector(".status").innerHTML = `
            <p>❌ You are not within the allowed location to sign in.</p>
            <p>You are approximately ${distanceKm} km away from the required location.</p>
            <button onclick="location.reload()">Try Again</button>
          `;
        }
      },
      function (error) {
        if (error.code === error.PERMISSION_DENIED) {
          // If location access is denied
          const allowAccessMessage = `
            <p>We couldn't get your location because access was denied.</p>
            <p>Please allow location access to proceed to the form.</p>
            <button onclick="location.reload()">Try Again</button>
          `;
          document.querySelector(".status").innerHTML = allowAccessMessage;
        } else {
          // Handle other errors
          document.querySelector(".status").innerText =
            "An error occurred while trying to get your location. Please try again.";
        }
      },
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  </script>
</body>
</html>
